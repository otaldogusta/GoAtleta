<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quadra 3D · Go Atleta</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#09090f;scrollbar-gutter:auto;font-family:Arial,sans-serif;color:#dce9fc}
canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
#labels{position:absolute;inset:0;pointer-events:none}
.actor-label{position:absolute;transform:translate(-50%,-100%);border:0;background:#0a112366;color:#e4edfa;padding:3px 5px;border-radius:5px;font:12px Arial,sans-serif;pointer-events:auto;cursor:pointer;white-space:nowrap}
.actor-position{position:absolute;transform:translateX(-50%);background:#0a1123e6;color:#e4edfa;border-radius:999px;min-width:19px;text-align:center;padding:2px;font:600 11px/15px Arial,sans-serif;pointer-events:none}
.actor-label:focus-visible{outline:2px solid #8fbeff;outline-offset:2px}
.actor-label[data-hovered=true]{background:#224263aa;color:#fff}
.guide-handle{position:absolute;z-index:5;width:44px;height:44px;padding:0;transform:translate(-50%,-50%);touch-action:none;cursor:grab;background:transparent;border:0;border-radius:50%;pointer-events:auto}
.guide-handle::after{content:'';position:absolute;inset:15px;border:2px solid #9dcbf1;border-radius:50%;box-shadow:0 0 0 1px #07101e}
.guide-handle.apex::after{inset:18px;background:#72b6ef;border:0}.guide-handle.target::after{inset:11px;border-style:dashed}.guide-handle.serve::after{border-color:#c48d8f}
.guide-handle:active{cursor:grabbing}.guide-handle:hover{background:#73b5f01f}.guide-handle:focus-visible{outline:2px solid #8fbeff;outline-offset:1px}
.guide-handle.elevation::after{content:'↕';inset:10px;border:1px solid #9dcbf1;border-radius:6px;background:#0a1123;color:#b9e0ff;font:20px/22px Arial,sans-serif;text-align:center}
.elevation-label{position:absolute;top:12px;left:40px;white-space:nowrap;pointer-events:none;padding:3px 5px;border-radius:5px;background:#0a1123dd;color:#dce9fc;font:11px Arial,sans-serif}
.guide-handle.trajectory .elevation-label{visibility:hidden}.guide-handle.trajectory:hover .elevation-label,.guide-handle.trajectory:focus-visible .elevation-label,.guide-handle.trajectory[data-dragging=true] .elevation-label{visibility:visible}
.guide-handle.trajectory:disabled{opacity:.4;cursor:default}
.guide-handle[data-label-side=left] .elevation-label{left:auto;right:40px}
.guide-handle[data-label-side=above] .elevation-label{left:50%;top:-14px;transform:translateX(-50%)}
.elevation-tether{position:absolute;z-index:4;height:1px;background:#9dcbf166;transform-origin:0 50%;pointer-events:none}
#simulation-feedback{position:absolute;bottom:25px;left:20px;z-index:3;color:#9dc5e8;font-size:12px;pointer-events:none}#simulation-feedback[data-blocked=true]{color:#ec9a9f}
#net-warnings{position:absolute;inset:0;z-index:4;pointer-events:none}
.net-warning{position:absolute;box-sizing:border-box;height:26px;display:flex;align-items:center;justify-content:center;gap:4px;padding:4px 6px;border:1px solid #f2a03d55;border-radius:5px;background:#0a1123dd;color:#f2a03d;font:500 11px/16px Arial,sans-serif;white-space:nowrap;pointer-events:none}
.net-warning-icon{display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;width:14px;height:14px;flex-shrink:0;border:1px solid currentColor;border-radius:50%;font-size:10px;font-weight:700;line-height:12px}
.net-warning-contact{position:absolute;width:5px;height:5px;border:1px solid #0a1123;border-radius:50%;background:#f2a03d;transform:translate(-50%,-50%);pointer-events:none}
.net-warning-tether{position:absolute;height:1px;background:#f2a03d80;transform-origin:0 50%;pointer-events:none}
@media(max-width:700px){#simulation-feedback{top:auto;bottom:116px;left:12px;transform:none;white-space:nowrap;font-size:11px}}
@media(max-width:380px){#simulation-feedback{bottom:152px}}
#error{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;background:#09090f;line-height:1.5}
[hidden]{display:none!important}
</style>
<canvas id="scene" tabindex="0" aria-label="Quadra 3D interativa. Arraste jogadores e materiais. Arraste o fundo para girar. Use dois dedos para aproximar e mover a vista, ou a rolagem para aproximar."></canvas>
<div id="labels" aria-label="Jogadores da quadra"></div>
<div id="simulation-handles" aria-label="Ajustes da quadra"></div>
<div id="net-warnings" aria-label="Avisos das trajetórias" aria-live="off"></div>
<output id="simulation-feedback" aria-live="polite" hidden></output>
<div id="error" hidden role="status"></div>
<script type="module" src="./renderer.mjs?v=reception-attack-ready-20261123"></script>
</html>
