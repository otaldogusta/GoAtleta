name: Core CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  SENTRY_DISABLE_AUTO_UPLOAD: 'true'

concurrency:
  group: core-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Tests and validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies and verify patches
        run: npm ci

      # Restore tool caches only. Pass receipts are local and are never trusted by CI.
      - name: Restore ESLint and Jest caches
        uses: actions/cache@v4
        with:
          path: |
            .tmp/validation/eslint
            .tmp/validation/jest
          key: validation-tools-${{ runner.os }}-node24-${{ hashFiles('package-lock.json', 'patches/**', 'eslint.config.js', 'jest.config.js', 'jest.setup.js', 'babel.config.js', 'scripts/check-lint-hygiene.js') }}-${{ github.sha }}
          restore-keys: |
            validation-tools-${{ runner.os }}-node24-${{ hashFiles('package-lock.json', 'patches/**', 'eslint.config.js', 'jest.config.js', 'jest.setup.js', 'babel.config.js', 'scripts/check-lint-hygiene.js') }}-

      - name: Validate the complete app and isolated SQL transactions
        run: npm run validate:app -- --fresh

      - name: Verify PostgreSQL transactions across independent connections
        run: npm run test:sql:concurrency

  web:
    name: Web build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

  core:
    name: Core checks
    needs: [validate, web]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful tests and web build
        env:
          VALIDATION_RESULT: ${{ needs.validate.result }}
          WEB_RESULT: ${{ needs.web.result }}
        run: |
          echo "Tests and validation = $VALIDATION_RESULT, web build = $WEB_RESULT"
          [[ "$VALIDATION_RESULT" == "success" && "$WEB_RESULT" == "success" ]]
