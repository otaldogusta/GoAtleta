name: Core CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  core:
    # Preserve the existing check name used by branch protection; coverage is full app.
    name: Core checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies and verify patches
        run: npm ci

      - name: Validate the complete app and isolated SQL transactions
        run: npm run validate:app

      - name: Build web
        run: npm run build
