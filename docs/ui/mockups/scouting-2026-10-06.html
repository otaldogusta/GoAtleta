 if(won&&s.serve==='them')s.rotation=(s.rotation+4)%6+1;s.serve=won?'us':'them';
 c.draft=[];nextContact(s);renderCapture(s,'[data-contact-athlete]');notify(`Ponto registrado · ${scoreOf(s).join(' × ')}`);
}
function reopenPoint(s) {
 const c=captureState(s),r=s.rallies.at(-1);if(c.draft.length||c.editing!==null||c.athlete!==null||!r?.captured)return;
 s.rallies.pop();s.actions=s.actions.filter(a=>a.rallyId!==r.id);s.serve=r.serve;s.rotation=r.rotation;
 c.draft=r.actions.map(({rallyId,...a})=>({...a}));nextContact(s);renderCapture(s,'[data-edit-contact]');notify('Ponto reaberto. O placar foi restaurado.');
}
function pointHistory(s) {
 let us=0,them=0;const rows=s.rallies.map((r,i)=>{r.won?us++:them++;return `<div class="point-history-row"><strong>${us} : ${them}</strong><div><b>${r.won?'Nosso ponto':'Ponto adversário'}</b><p>${r.actions?.length?r.actions.map(a=>esc(contactText(a))).join(' → '):'Somente placar · sem contatos registrados'}</p><small>Jogada ${i+1} · saque ${r.serve==='us'?'nosso':'adversário'} · R${r.rotation}</small></div></div>`;});
 showInfo('Pontos do set 1',rows.reverse().join('')||'<p class="muted">O primeiro ponto aparecerá aqui.</p>');
}
document.addEventListener('click',event=>{
 const b=event.target.closest('button'),s=sessions.find(s=>s.id===selectedId);if(!b||!s?.live)return;const c=captureState(s);
 if(b.dataset.contactAthlete!==undefined){c.athlete=b.dataset.contactAthlete==='team'?'team':Number(b.dataset.contactAthlete);renderCapture(s,`[data-contact-athlete="${b.dataset.contactAthlete}"]`);}
 if(b.dataset.contactSkill!==undefined){c.skill=Number(b.dataset.contactSkill);renderCapture(s,`[data-contact-skill="${c.skill}"]`);}
 if(b.dataset.contactResult!==undefined)registerContact(s,Number(b.dataset.contactResult));
 if(b.dataset.closePoint)closePoint(s,b.dataset.closePoint);
 if(b.dataset.editContact!==undefined){c.editing=Number(b.dataset.editContact);const a=c.draft[c.editing];c.athlete=a.athlete;c.skill=a.skill;c.zone=a.zone;c.showZone=!!a.zone;renderCapture(s,`[data-contact-athlete="${c.athlete}"]`);}
 if(b.id==='undo-contact'){c.draft.pop();nextContact(s);renderCapture(s,'[data-contact-athlete]');}
 if(b.id==='remove-contact'){c.draft.splice(c.editing,1);nextContact(s);renderCapture(s,'[data-contact-athlete]');}
 if(b.id==='cancel-contact-edit'){nextContact(s);renderCapture(s,'[data-edit-contact]');}
 if(b.id==='cancel-new-contact'){nextContact(s);renderCapture(s,'[data-contact-athlete]');}
 if(b.id==='contact-location'){c.showZone=!c.showZone;renderCapture(s,'#contact-location');}
 if(b.dataset.contactZone){c.zone=Number(b.dataset.contactZone);renderCapture(s,`[data-contact-zone="${c.zone}"]`);}
 if(b.id==='clear-zone'){c.zone=null;c.showZone=false;renderCapture(s,'#contact-location');}
 if(b.id==='contact-criteria')showInfo('Como avaliar',criteria(c.skill));
 if(b.id==='reopen-point')reopenPoint(s);
 if(b.id==='point-history')pointHistory(s);
 if(b.id==='undo-training'&&s.last){s.actions.pop();s.last=s.last.previous;renderCapture(s,'[data-contact-athlete]');}
});

document.addEventListener('click',event=>{
 const b=event.target.closest('button');if(!b)return;
 if(b.dataset.mode)setMode(b.dataset.mode);if(b.dataset.scenario)setScenario(b.dataset.scenario);if(b.dataset.tab)showTab(b.dataset.tab);if(b.dataset.skill!==undefined){skill=Number(b.dataset.skill);render();}if(b.dataset.open){collectorSkill=skill;openDetail(Number(b.dataset.open));}if(b.hasAttribute('data-close'))b.closest('dialog').close();
 if(b.id==='criteria')showInfo('Como avaliar',criteria(skill));if(b.id==='capture-criteria')showInfo('Como avaliar',criteria(collectorSkill));
 if(b.id==='evidence'){const a=actionsOf(reviewItems()).filter(a=>a.skill===skill);showInfo(`${skills[skill]} · ${a.length} ações`,a.map(evidenceRow).join(''));}
 if(b.id==='compare'){const items=reviewItems();showInfo(`${skills[skill]} por sessão`,`<p class="meta">Mesmo formato e rubrica. As condições da tarefa e os participantes também podem mudar.</p>${items.map(s=>{const c=countsOf(s.actions),m=metric(c,skill);return `<div class="evidence-row"><span><strong>${formatDate(s.date)} · ${esc(s.title)}</strong><small>${sum(c)} ações · ${s.format}</small></span><strong>${m.value}</strong></div>`;}).join('')}<p class="meta">Este recorte descreve as sessões; sozinho não comprova evolução.</p>`);}
 if(b.id==='rotations'){const r=reviewItems().flatMap(s=>s.rallies);showInfo('Pontos por rodízio',`<p class="meta">Somente rallies registrados · R = posição do levantador usada como referência nesta prévia.</p><div class="rotation-table"><div><strong>Rodízio</strong><strong>Recebendo</strong><strong>Sacando</strong></div>${[1,2,3,4,5,6].map(rot=>{const a=r.filter(x=>x.rotation===rot&&x.serve==='them'),z=r.filter(x=>x.rotation===rot&&x.serve==='us');return `<div><strong>R${rot}</strong><span>${a.filter(x=>x.won).length}/${a.length} · ${pct(a.filter(x=>x.won).length,a.length)}</span><span>${z.filter(x=>x.won).length}/${z.length} · ${pct(z.filter(x=>x.won).length,z.length)}</span></div>`;}).join('')}</div><p class="meta">Amostras pequenas por rodízio. Use para revisar lances, sem ordenar a equipe do melhor ao pior.</p>`);}
 if(b.id==='focus'){showInfo('Foco do próximo treino',`<form id="focus-form"><label class="field" for="focus-note">O que você quer trabalhar?</label><div class="control"><input id="focus-note" maxlength="180" value="${esc(focusNotes.get(focusKey())||['Construção após a recepção','Regularidade e direção do saque','Escolha do ataque','Organização após a defesa'][skill])}" required></div><p class="meta" style="margin:12px 0">Você define o foco. Este exemplo não altera o planejamento do app.</p><button class="button primary" type="submit">Guardar foco no exemplo</button></form>`);$('focus-form').onsubmit=e=>{e.preventDefault();const value=$('focus-note').value.trim();if(!value)return;focusNotes.set(focusKey(),value);render();$('info-dialog').close();};}
 if(b.id==='finish'){const s=sessions.find(s=>s.id===selectedId);if(captureState(s).draft.length||captureState(s).editing!==null||s.type!=='Treino'&&captureState(s).athlete!==null)return;s.live=false;s.last=null;render();openDetail(s.id);notify('Análise concluída no exemplo.');}
 if(b.id==='clear-filters'){$('search').value='';$('kind').value='all';$('period').value='all';render();}
});
$('new').onclick=()=>{document.querySelector(`[name=type][value="${mode==='train'?'Treino':'Jogo'}"]`).checked=true;newFormChanged();$('new-dialog').showModal();};
$('back').onclick=()=>showTab('overview');$('all-history').onclick=()=>showTab('history');$('period').onchange=render;$('context').onchange=render;$('search').oninput=renderHistory;$('kind').onchange=renderHistory;
function newFormChanged(){const type=new FormData($('new-form')).get('type');$('opponent-field').hidden=type==='Treino';$('training-format').hidden=type!=='Treino';$('serve-field').hidden=type==='Treino';$('rotation-field').hidden=type==='Treino';$('create').disabled=!$('new-date').value;}
$('new-form').onchange=newFormChanged;
$('new-form').onsubmit=event=>{event.preventDefault();const type=new FormData(event.target).get('type'),date=$('new-date').value;if(!date)return;const note=$('note').value.trim(),opponent=$('opponent').value.trim();const s=makeSession({id:Date.now(),title:note||(type==='Treino'?'Treino técnico':opponent?`${type} com ${opponent}`:type),date,type,format:type==='Treino'?$('new-format').value:'6x6',counts:skills.map(()=>[0,0,0,0]),live:true});s.serve=$('initial-serve').value;s.rotation=Number($('initial-rotation').value);collectorAthlete='team';sessions.unshift(s);sessions.sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);$('period').value='all';setMode(type==='Treino'?'train':'game');$('context').value=s.format;$('new-dialog').close();render();openDetail(s.id);};
$('theme').onclick=()=>{const light=document.documentElement.dataset.theme!=='light';document.documentElement.dataset.theme=light?'light':'dark';document.querySelector('.theme-label').textContent=light?'Tema escuro':'Tema claro';};
$('device').onclick=()=>{const mobile=$('frame').classList.toggle('mobile');$('device').setAttribute('aria-pressed',String(mobile));$('device').querySelector('span').textContent=mobile?'Desktop':'Mobile';};
document.querySelectorAll('[role=tab]').forEach(tab=>tab.addEventListener('keydown',event=>{if(!['ArrowRight','ArrowLeft','Home','End'].includes(event.key))return;event.preventDefault();showTab(event.key==='Home'?'overview':event.key==='End'?'history':activeTab==='overview'?'history':'overview');$('tab-'+activeTab).focus();}));
document.querySelectorAll('dialog').forEach(dialog=>dialog.addEventListener('click',event=>{if(event.target!==dialog)return;const r=dialog.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)dialog.close();}));
render();
if(new URLSearchParams(location.search).get('coleta')==='jogo'){setMode('game');openDetail(7);}
</script>
